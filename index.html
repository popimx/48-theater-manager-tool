<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; } /* 下部ナビ表示用パディング */
    /* 丸アイコンのスタイル定義 */
    .avatar-img { object-fit: cover; width: 42px; height: 42px; border-radius: 9999px; }
    .avatar-img-lg { object-fit: cover; width: 56px; height: 56px; border-radius: 9999px; }
    .avatar-img-sm { object-fit: cover; width: 34px; height: 34px; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
      
      <!-- チーム選択 -->
      <select id="teamSelector" onchange="switchTeam(this.value)" class="bg-pink-700 text-white font-bold text-sm rounded-lg px-3 py-1.5 border border-pink-500 focus:outline-none w-full sm:w-auto cursor-pointer">
        <option value="A">チームA（ここからだ）</option>
        <option value="B">チームB（RESET）</option>
        <option value="C">チームC（M.T.に捧ぐ）</option>
        <option value="D">チームD（シアターの女神）</option>
        <option value="E" selected>チームE（制服の芽）</option>
        <option value="F">チームF（ここにだって天使はいる）</option>
        <option value="G">チームG（目撃者）</option>
      </select>
    </div>

    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="メンバー名 / チーム名 / 演目名で検索..." 
               class="w-full pl-9 pr-4 py-2 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>
      <!-- サジェストドロップダウン -->
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">

    <!-- Tab 1: カレンダー -->
    <section id="tab-calendar" class="tab-content">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
        <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-regular fa-calendar-days text-pink-500"></i> 劇場スケジュール
        </h2>
        <div class="flex flex-wrap gap-1.5 mb-4">
          <button onclick="filterTheater('ALL')" class="theater-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1 rounded-full">全劇場</button>
          <button onclick="filterTheater('AKB48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">AKB48劇場</button>
          <button onclick="filterTheater('SKE48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">SKE48劇場</button>
          <button onclick="filterTheater('NMB48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NMB48劇場</button>
          <button onclick="filterTheater('HKT48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">HKT48劇場</button>
          <button onclick="filterTheater('NGT_STU')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NGT/STU</button>
        </div>
        <div id="calendarList" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- Tab 2: ポジション ＆ ユニット一覧 -->
    <section id="tab-positions" class="tab-content hidden space-y-4">
      
      <!-- ① ポジション一覧 -->

        <div class="flex justify-between items-center mb-3">

            <h2 id="posTeamTitle" class="text-lg font-bold text-slate-800">チームE</h2>

          </div>

        </div>

        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ポジション一覧（16枠 / 固定メンバー ＆ アンダー候補）</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>

                <th class="p-2" colspan="2">固定メンバー</th>
                <th class="p-2" colspan="2">アンダー候補メンバー</th>
              </tr>
            </thead>
            <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- ② 日別ユニット一覧 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1.5">
          <i class="fa-solid fa-music text-pink-500"></i> 日別ユニットポジション一覧
        </h3>
        <p class="text-xs text-slate-400 mb-3">公演日付ごとのユニット出演記録</p>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse border border-slate-200 whitespace-nowrap">
            <thead id="unitTableHead" class="bg-slate-50 text-slate-700 border-b border-slate-200"></thead>
            <tbody id="unitTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- Tab 3: 出演・休演予想 (全員選択) -->
    <section id="tab-predict" class="tab-content hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-base font-bold text-slate-800">出演・休演予想シミュレーター</h2>
          <span id="memberCountBadge" class="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full">全38名</span>
        </div>
        <p class="text-xs text-slate-500 mb-4">メンバーアイコンをタップして【休演】を選択すると、アンダーメンバーが自動で補填されます。</p>

        <!-- メンバー壁写選択グリッド（全員） -->
        <div class="mb-6">
          <h3 class="text-xs font-bold text-slate-600 mb-2 border-b pb-1 flex justify-between items-center">
            <span>チーム全員一覧（タップで休演切替）</span>
            <button onclick="resetAbsence()" class="text-xs text-pink-600 hover:underline font-normal">休演リセット</button>
          </h3>
          <div id="memberGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5"></div>
        </div>

        <!-- 予想スターティングラインナップ -->
        <div>
          <h3 class="text-xs font-bold text-pink-600 mb-2 border-b pb-1 flex justify-between items-center">
            <span>予想スターティング16名</span>
            <span id="subCountText" class="text-xs text-slate-500 font-normal">アンダー補填: 0名</span>
          </h3>
          <div id="predictedLineup" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
        </div>
      </div>
    </section>

  </main>

        <i class="fa-solid fa-wand-magic-sparkles text-base block mb-0.5"></i>
        予想

    </div>
  </nav>

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-pink-600');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      activeBtn.classList.add('active', 'text-pink-600');
      activeBtn.classList.remove('text-slate-400');
    }

    // --- 検索機能 ---
    function onSearchInput(val) {
      const suggestBox = document.getElementById('searchSuggest');
      if (!val.trim()) {
        suggestBox.classList.add('hidden');
        return;
      }
      const query = val.toLowerCase();
      let matches = [];

      Object.keys(RAW_TEAMS_DATA).forEach(key => {
        const t = RAW_TEAMS_DATA[key];
        if (t.name.toLowerCase().includes(query) || t.stage.toLowerCase().includes(query)) {
          matches.push({ type: 'team', label: `${t.name} (演目: ${t.stage})`, key: key });
        }
        t.fixed.forEach((name, idx) => {
          if (name.toLowerCase().includes(query)) {
            matches.push({ type: 'member', label: `${name} (${t.name} ${idx < 16 ? (idx+1)+'番手' : '固定枠外'})`, key: key });
          }
        });
        t.unset.forEach(name => {
          if (name.toLowerCase().includes(query)) {
            matches.push({ type: 'member', label: `${name} (${t.name} アンダー)`, key: key });
          }
        });
      });

      if (matches.length === 0) {
        suggestBox.classList.add('hidden');
        return;
      }

      suggestBox.innerHTML = matches.slice(0, 8).map(m => `
        <div onclick="selectSuggest('${m.key}')" class="p-2.5 hover:bg-pink-50 cursor-pointer flex justify-between items-center">
          <span class="font-medium text-slate-800">${m.label}</span>
          <span class="text-xs text-pink-600 font-bold">${m.type === 'team' ? 'チーム' : 'メンバー'}</span>
        </div>
      `).join('');
      suggestBox.classList.remove('hidden');
    }

    function selectSuggest(teamKey) {
      document.getElementById('searchSuggest').classList.add('hidden');
      document.getElementById('searchInput').value = '';
      switchTeam(teamKey);
      switchTab('positions');
    }

    // --- Tab 1: カレンダー ---
    function filterTheater(theater) {
      currentTheaterFilter = theater;
      document.querySelectorAll('.theater-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white');
        btn.classList.add('bg-slate-200', 'text-slate-700');
      });
      event.target.classList.remove('bg-slate-200', 'text-slate-700');
      event.target.classList.add('bg-slate-800', 'text-white');
      renderCalendar();
    }

    function renderCalendar() {
      const listContainer = document.getElementById('calendarList');
      listContainer.innerHTML = '';

      const filtered = SCHEDULE_DATA.filter(item => 
        currentTheaterFilter === 'ALL' || item.theater === currentTheaterFilter
      );

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-200";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-center bg-white border border-slate-200 px-2 py-1 rounded w-14">
              <span class="block text-xs text-slate-500 font-bold">${item.date.split('-')[1]}/${item.date.split('-')[2]}</span>
              <span class="block text-xs font-bold text-pink-600">${item.time}</span>
            </div>
            <div>
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-pink-100 text-pink-700">${item.theater}</span>
              <h4 class="font-bold text-slate-800 text-xs mt-0.5">チーム${item.team}「${item.stage}」</h4>
            </div>
          </div>
          <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full">最大16名</span>
        `;
        listContainer.appendChild(card);
      });
    }

    // --- Tab 2: ポジション ＆ ユニット一覧 ---
    function renderPositionsAndUnits() {
      const team = RAW_TEAMS_DATA[currentTeamKey];
      document.getElementById('posTeamTitle').innerText = team.name;
      document.getElementById('posStageTitle').innerText = `演目：「${team.stage}」公演`;
      document.getElementById('fixedCountBadge').innerText = `固定 ${team.fixed.length}名`;

      // ① ポジション表（基本16ポジションを表示）
      const tbody = document.getElementById('positionTableBody');
      tbody.innerHTML = '';

      for (let pos = 1; pos <= 16; pos++) {
        const fixedName = team.fixed[pos - 1]; // 存在しない場合は undefined
        const isPresent = !!fixedName;
        
        const nameText = isPresent ? fixedName : "－";
        const imgUrl = getAvatar(nameText, "E91E63");

        // アンダー候補（未設定メンバーから順に割り当て）
        const subName = team.unset[pos - 1] || "未定";
        const subImg = getAvatar(subName, "9C27B0");

        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="p-2 text-center font-bold text-slate-400">${pos}</td>
          <td class="p-1.5 w-12"><img src="${imgUrl}" alt="${nameText}" class="avatar-img"></td>
          <td class="p-2 font-bold ${isPresent ? 'text-slate-800' : 'text-slate-400'}">${nameText} ${pos === 1 && isPresent ? '🌟' : ''}</td>
          <td class="p-1.5 w-12"><img src="${subImg}" alt="${subName}" class="avatar-img"></td>
          <td class="p-2 text-slate-600">${subName}</td>
        `;
        tbody.appendChild(tr);
      }

      // ② 日別ユニット一覧表
      const uHead = document.getElementById('unitTableHead');
      const uBody = document.getElementById('unitTableBody');
      uHead.innerHTML = '';
      uBody.innerHTML = '';

      if (!team.unitHeaders || team.unitHeaders.length === 0) {
        uBody.innerHTML = `<tr><td class="p-3 text-slate-400 text-center">ユニット履歴準備中</td></tr>`;
        return;
      }

      let headHTML = `<tr class="divide-x divide-slate-200"><th class="p-2 font-bold text-center bg-slate-100">公演日付</th>`;
      team.unitHeaders.forEach(uName => {
        headHTML += `<th class="p-2 font-bold text-center">${uName}</th>`;
      });
      headHTML += `</tr>`;
      uHead.innerHTML = headHTML;

      (team.unitLogs || []).forEach(log => {
        let rowHTML = `<tr class="divide-x divide-slate-100 hover:bg-slate-50"><td class="p-2 font-bold text-center text-pink-600">${log.date}</td>`;
        log.performers.forEach(pName => {
          rowHTML += `<td class="p-2 text-center text-slate-700">${pName}</td>`;
        });
        rowHTML += `</tr>`;
        uBody.innerHTML += rowHTML;
      });
    }

    // --- Tab 3: 出演・休演予想 (全員選択) ---
    function initPredictTab() {
      const team = RAW_TEAMS_DATA[currentTeamKey];
      const grid = document.getElementById('memberGrid');
      grid.innerHTML = '';

      const totalMembers = team.fixed.length + team.unset.length;
      document.getElementById('memberCountBadge').innerText = `全${totalMembers}名`;

      // チーム全員のリスト構築 (固定メンバー + 未設定メンバー)
      let memberList = [];
      
      // 固定メンバー (16枠内は「X番手」、16枠外は「アンダー」)
      team.fixed.forEach((name, idx) => {
        memberList.push({
          name: name,
          roleLabel: idx < 16 ? `${idx + 1}番手` : 'アンダー',
          isFixed: true,
          fixedPos: idx < 16 ? idx + 1 : null
        });
      });

      // ポジション未設定メンバー
      team.unset.forEach(name => {
        memberList.push({
          name: name,
          roleLabel: 'アンダー',
          isFixed: false,
          fixedPos: null
        });
      });

      memberList.forEach(m => {
        const isAbsent = !!absentMembersMap[m.name];
        const imgUrl = getAvatar(m.name, m.isFixed ? "E91E63" : "9C27B0");

        const card = document.createElement('div');
        card.onclick = () => toggleAbsence(m.name);
        card.className = `p-2 rounded-xl border flex flex-col items-center justify-center cursor-pointer transition select-none ${
          isAbsent ? 'bg-red-50 border-red-300 shadow-inner' : 'bg-white border-slate-200 hover:border-pink-300 shadow-sm'
        }`;

        card.innerHTML = `
          <div class="relative mb-1">
            <img src="${imgUrl}" alt="${m.name}" class="avatar-img-lg ${isAbsent ? 'grayscale opacity-50' : ''}">
            ${isAbsent ? '<span class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full border border-white">休</span>' : ''}
          </div>
          <span class="text-xs font-bold text-center leading-tight ${isAbsent ? 'text-red-500 line-through' : 'text-slate-800'}">${m.name}</span>
          <span class="text-[10px] ${m.fixedPos ? 'text-pink-600 font-bold' : 'text-slate-400'}">${m.roleLabel}</span>
        `;
        grid.appendChild(card);
      });

      renderPredictedLineup();
    }

    function toggleAbsence(memberName) {
      absentMembersMap[memberName] = !absentMembersMap[memberName];
      initPredictTab();
    }

    function resetAbsence() {
      absentMembersMap = {};
      initPredictTab();
    }

    function renderPredictedLineup() {
      const team = RAW_TEAMS_DATA[currentTeamKey];
      const lineupContainer = document.getElementById('predictedLineup');
      lineupContainer.innerHTML = '';

      // アンダー候補メンバーのキュー（固定16枠外のメンバー ＋ 未設定メンバー で休演していない人）
      let subPool = [];
      if (team.fixed.length > 16) {
        team.fixed.slice(16).forEach(name => {
          if (!absentMembersMap[name]) subPool.push(name);
        });
      }
      team.unset.forEach(name => {
        if (!absentMembersMap[name]) subPool.push(name);
      });

      let subIndex = 0;
      let subCount = 0;

      // 1〜16ポジションを判定してラインナップ生成
      for (let pos = 1; pos <= 16; pos++) {
        const fixedName = team.fixed[pos - 1]; // pos番目の固定メンバー名
        const isPresent = fixedName && !absentMembersMap[fixedName];

        const div = document.createElement('div');

        if (isPresent) {
          // 固定メンバーが出演
          div.className = "p-2 bg-slate-50 rounded-lg border border-slate-200 flex items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center gap-2.5">
              <span class="font-bold text-slate-400 text-xs w-5 text-center">P${pos}</span>
              <img src="${getAvatar(fixedName, 'E91E63')}" class="avatar-img-sm">
              <span class="font-bold text-slate-800 text-xs">${fixedName}</span>
            </div>
            <span class="text-[10px] bg-slate-200 text-slate-600 font-semibold px-2 py-0.5 rounded-full">${pos}番手</span>
          `;
        } else {
          // 休演 または 枠が「－」のためアンダー補填
          subCount++;
          const subName = subPool[subIndex] || "未定";
          subIndex++;

          div.className = "p-2 bg-amber-50 border border-amber-200 rounded-lg flex items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center gap-2.5">
              <span class="font-bold text-amber-600 text-xs w-5 text-center">P${pos}</span>
              <img src="${getAvatar(subName, '9C27B0')}" class="avatar-img-sm border border-amber-300">
              <div>
                <span class="font-bold text-amber-900 text-xs block leading-tight">${subName}</span>
                <span class="text-[10px] text-slate-400 ${fixedName ? 'line-through' : ''}">${fixedName ? '休: ' + fixedName : '固定なし'}</span>
              </div>
            </div>
            <span class="text-[10px] bg-amber-200 text-amber-800 font-bold px-2 py-0.5 rounded-full">アンダー</span>
          `;
        }
        lineupContainer.appendChild(div);
      }

      document.getElementById('subCountText').innerText = `アンダー補填: ${subCount}名`;
    }
  </script>
</body>
</html>
