 <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; } /* 下部ナビ表示用パディング */
    .avatar-img { object-fit: cover; width: 40px; height: 50px; border-radius: 6px; }
    .avatar-img-lg { object-fit: cover; width: 56px; height: 70px; border-radius: 8px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
      
      <!-- チーム選択 -->
      <select id="teamSelector" onchange="switchTeam(this.value)" class="bg-pink-700 text-white font-bold text-sm rounded px-3 py-1.5 border border-pink-500 focus:outline-none w-full sm:w-auto">
        <option value="A">チームA（ここからだ）</option>
        <option value="B">チームB（RESET）</option>
        <option value="C">チームC（M.T.に捧ぐ）</option>
        <option value="D">チームD（シアターの女神）</option>
        <option value="E" selected>チームE（制服の芽）</option>
        <option value="F">チームF（ここにだって天使はいる）</option>
        <option value="G">チームG（目撃者）</option>
      </select>
    </div>

    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="メンバー名 / チーム名 / 演目名で検索..." 
               class="w-full pl-9 pr-4 py-1.5 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
      </div>
      <!-- サジェストドロップダウン -->
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4">

    <!-- Tab 1: カレンダー -->
    <section id="tab-calendar" class="tab-content">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
        <h2 class="text-base font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-regular fa-calendar-days text-pink-500"></i> 劇場スケジュール
        </h2>
        <div class="flex flex-wrap gap-1.5 mb-4">
          <button onclick="filterTheater('ALL')" class="theater-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1 rounded-full">全劇場</button>
          <button onclick="filterTheater('AKB48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">AKB48劇場</button>
          <button onclick="filterTheater('SKE48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">SKE48劇場</button>
          <button onclick="filterTheater('NMB48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NMB48劇場</button>
          <button onclick="filterTheater('HKT48')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">HKT48劇場</button>
          <button onclick="filterTheater('NGT_STU')" class="theater-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NGT/STU (交互)</button>
        </div>
        <div id="calendarList" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- Tab 2: ポジション ＆ ユニット一覧 -->
    <section id="tab-positions" class="tab-content hidden space-y-4">
      
      <!-- ① ポジション一覧 (固定壁写＋名前 / アンダー壁写＋名前) -->

          </div>

        </div>

        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ポジション一覧（固定メンバー ＆ アンダーメンバー）</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                <th class="p-2 w-10 text-center">Pos</th>
                <th class="p-2" colspan="2">固定メンバー</th>
                <th class="p-2" colspan="2">アンダーメンバー</th>
              </tr>
            </thead>
            <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- ② 日別ユニット一覧 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i class="fa-solid fa-music text-pink-500"></i> 日別ユニットポジション一覧
        </h3>
        <p class="text-xs text-slate-400 mb-3">公演日付ごとのユニット出演ポジション結果</p>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse border border-slate-200 whitespace-nowrap">
            <thead id="unitTableHead" class="bg-slate-50 text-slate-700 border-b border-slate-200"></thead>
            <tbody id="unitTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- Tab 3: 出演・休演予想 (壁写アイコン選択) -->
    <section id="tab-predict" class="tab-content hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">出演・休演予想シミュレーター</h2>
        <p class="text-xs text-slate-500 mb-4">チーム全員から【休演メンバー】をタップして選択すると、アンダーメンバーが自動補填されます。</p>

        <!-- メンバー壁写選択グリッド -->
        <div class="mb-6">
          <h3 class="text-xs font-bold text-slate-600 mb-2 border-b pb-1">チーム所属メンバー（タップで休演切替）</h3>
          <div id="memberGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2"></div>
        </div>

        <!-- 予想スターティングラインナップ -->
        <div>
          <h3 class="text-xs font-bold text-pink-600 mb-2 border-b pb-1 flex justify-between items-center">
            <span>予想スターティング16名</span>
            <button onclick="resetAbsence()" class="text-xs text-slate-400 underline font-normal">リセット</button>
          </h3>
          <div id="predictedLineup" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->

    <div class="max-w-4xl mx-auto flex justify-around">

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active', 'text-pink-600');
        btn.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tabName}`);
      activeBtn.classList.add('active', 'text-pink-600');
      activeBtn.classList.remove('text-slate-400');
    }

    // チーム切り替え
    function switchTeam(teamKey) {
      currentTeamKey = teamKey;
      document.getElementById('teamSelector').value = teamKey;
      absentMembersMap = {};
      renderPositionsAndUnits();
      initPredictTab();
    }

    // --- 検索機能 ---
    function onSearchInput(val) {
      const suggestBox = document.getElementById('searchSuggest');
      if (!val.trim()) {
        suggestBox.classList.add('hidden');
        return;
      }
      const query = val.toLowerCase();
      let matches = [];

      // チーム / 演目マッチ
      Object.keys(TEAMS_DATA).forEach(key => {
        const t = TEAMS_DATA[key];
        if (t.name.toLowerCase().includes(query) || t.stage.toLowerCase().includes(query)) {
          matches.push({ type: 'team', label: `${t.name} (演目: ${t.stage})`, key: key });
        }
        // メンバーマッチ
        t.members.forEach(m => {
          if (m.name.toLowerCase().includes(query)) {
            matches.push({ type: 'member', label: `${m.name} (${t.name} Pos.${m.pos})`, key: key, memberName: m.name });
          }
        });
        t.substitutes.forEach(s => {
          if (s.name.toLowerCase().includes(query)) {
            matches.push({ type: 'member', label: `${s.name} (${t.name} 控え)`, key: key, memberName: s.name });
          }
        });
      });

      if (matches.length === 0) {
        suggestBox.classList.add('hidden');
        return;
      }

      suggestBox.innerHTML = matches.map(m => `
        <div onclick="selectSuggest('${m.key}')" class="p-2.5 hover:bg-pink-50 cursor-pointer flex justify-between items-center">
          <span class="font-medium text-slate-800">${m.label}</span>
          <span class="text-xs text-pink-600 font-bold">${m.type === 'team' ? 'チーム' : 'メンバー'}</span>
        </div>
      `).join('');
      suggestBox.classList.remove('hidden');
    }

    function selectSuggest(teamKey) {
      document.getElementById('searchSuggest').classList.add('hidden');
      document.getElementById('searchInput').value = '';
      switchTeam(teamKey);
      switchTab('positions');
    }

    // --- Tab 1: カレンダー ---
    function filterTheater(theater) {
      currentTheaterFilter = theater;
      document.querySelectorAll('.theater-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white');
        btn.classList.add('bg-slate-200', 'text-slate-700');
      });
      event.target.classList.remove('bg-slate-200', 'text-slate-700');
      event.target.classList.add('bg-slate-800', 'text-white');
      renderCalendar();
    }

    function renderCalendar() {
      const listContainer = document.getElementById('calendarList');
      listContainer.innerHTML = '';

      const filtered = SCHEDULE_DATA.filter(item => 
        currentTheaterFilter === 'ALL' || item.theater === currentTheaterFilter
      );

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between p-2.5 bg-slate-50 rounded-lg border border-slate-200";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="text-center bg-white border border-slate-200 px-2 py-1 rounded w-14">
              <span class="block text-xs text-slate-500 font-bold">${item.date.split('-')[1]}/${item.date.split('-')[2]}</span>
              <span class="block text-xs font-bold text-pink-600">${item.time}</span>
            </div>
            <div>
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-pink-100 text-pink-700">${item.theater}</span>
              <h4 class="font-bold text-slate-800 text-xs mt-0.5">チーム${item.team}「${item.stage}」</h4>
            </div>
          </div>
          <span class="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full">最大16名</span>
        `;
        listContainer.appendChild(card);
      });
    }

    // --- Tab 2: ポジション ＆ ユニット一覧 ---
    function renderPositionsAndUnits() {
      const team = TEAMS_DATA[currentTeamKey];
      document.getElementById('posTeamTitle').innerText = team.name;
      document.getElementById('posStageTitle').innerText = `演目：「${team.stage}」公演`;

      // ① ポジション表
      const tbody = document.getElementById('positionTableBody');
      tbody.innerHTML = '';

      if (team.members.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">枠調整中（データ準備中）</td></tr>`;
      } else {
        team.members.forEach(m => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-slate-50";
          tr.innerHTML = `
            <td class="p-2 text-center font-bold text-slate-400">${m.pos}</td>
            <td class="p-1.5 w-12"><img src="${m.img}" alt="${m.name}" class="avatar-img"></td>
            <td class="p-2 font-bold text-slate-800">${m.name} ${m.pos === 1 ? '🌟' : ''}</td>
            <td class="p-1.5 w-12"><img src="${m.subImg || getAvatar(m.subName, "9C27B0")}" alt="${m.subName}" class="avatar-img opacity-90"></td>
            <td class="p-2 text-slate-600">${m.subName || '未定'}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      // ② 日別ユニット一覧表
      const uHead = document.getElementById('unitTableHead');
      const uBody = document.getElementById('unitTableBody');
      uHead.innerHTML = '';
      uBody.innerHTML = '';

      if (!team.unitHeaders || team.unitHeaders.length === 0) {
        uBody.innerHTML = `<tr><td class="p-3 text-slate-400 text-center">ユニット履歴なし</td></tr>`;
        return;
      }

      // ヘッダー生成 (公演日付, ユニット名1, ユニット名2...)
      let headHTML = `<tr class="divide-x divide-slate-200"><th class="p-2 font-bold text-center bg-slate-100">公演日付</th>`;
      team.unitHeaders.forEach(uName => {
        headHTML += `<th class="p-2 font-bold text-center">${uName}</th>`;
      });
      headHTML += `</tr>`;
      uHead.innerHTML = headHTML;

      // 行データ生成
      (team.unitLogs || []).forEach(log => {
        let rowHTML = `<tr class="divide-x divide-slate-100 hover:bg-slate-50"><td class="p-2 font-bold text-center text-pink-600">${log.date}</td>`;
        log.performers.forEach(pName => {
          rowHTML += `<td class="p-2 text-center text-slate-700">${pName}</td>`;
        });
        rowHTML += `</tr>`;
        uBody.innerHTML += rowHTML;
      });
    }

    // --- Tab 3: 出演・休演予想 (壁写アイコン選択) ---
    function initPredictTab() {
      const team = TEAMS_DATA[currentTeamKey];
      const grid = document.getElementById('memberGrid');
      grid.innerHTML = '';

      if (!team || team.members.length === 0) {
        grid.innerHTML = `<p class="text-xs text-slate-400 col-span-4">データが設定されていません。</p>`;
        document.getElementById('predictedLineup').innerHTML = '';
        return;
      }

      // 全メンバーリスト（正規16名＋控えメンバー）
      const allTeamMembers = [
        ...team.members.map(m => ({ name: m.name, img: m.img, isRegular: true, pos: m.pos })),
        ...team.substitutes.map(s => ({ name: s.name, img: s.img, isRegular: false, pos: null }))
      ];

      allTeamMembers.forEach(m => {
        const isAbsent = !!absentMembersMap[m.name];
        const card = document.createElement('div');
        card.onclick = () => toggleAbsence(m.name);
        card.className = `p-2 rounded-lg border flex flex-col items-center justify-center cursor-pointer transition select-none ${
          isAbsent ? 'bg-red-50 border-red-300 opacity-60' : 'bg-white border-slate-200 hover:border-pink-400 shadow-sm'
        }`;

        card.innerHTML = `
          <div class="relative">
            <img src="${m.img}" alt="${m.name}" class="avatar-img-lg mb-1">
            ${isAbsent ? '<span class="absolute top-0 right-0 bg-red-600 text-white text-[10px] font-bold px-1 rounded">休</span>' : ''}
          </div>
          <span class="text-xs font-bold text-center leading-tight ${isAbsent ? 'text-red-600 line-through' : 'text-slate-800'}">${m.name}</span>
          <span class="text-[10px] text-slate-400">${m.isRegular ? `P${m.pos}` : '控え'}</span>
        `;
        grid.appendChild(card);
      });

      renderPredictedLineup();
    }

    function toggleAbsence(memberName) {
      absentMembersMap[memberName] = !absentMembersMap[memberName];
      initPredictTab();
    }

    function resetAbsence() {
      absentMembersMap = {};
      initPredictTab();
    }

    function renderPredictedLineup() {
      const team = TEAMS_DATA[currentTeamKey];
      const lineupContainer = document.getElementById('predictedLineup');
      lineupContainer.innerHTML = '';

      if (!team || team.members.length === 0) return;

      // 出演可能な控えプール
      const availableSubs = team.substitutes.filter(s => !absentMembersMap[s.name]);
      let subIndex = 0;

      team.members.forEach(m => {
        const isAbsent = absentMembersMap[m.name];
        const div = document.createElement('div');

        if (!isAbsent) {
          // 通常出演
          div.className = "p-2 bg-slate-50 rounded border border-slate-200 flex items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-400 text-xs w-5">P${m.pos}</span>
              <img src="${m.img}" class="w-8 h-10 object-cover rounded">
              <span class="font-bold text-slate-800">${m.name}</span>
            </div>
            <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded">正規</span>
          `;
        } else {
          // 休演 -> アンダー自動補填
          const sub = availableSubs[subIndex] || { name: m.subName || `控え枠${subIndex+1}`, img: m.subImg || getAvatar("控え") };
          subIndex++;

          div.className = "p-2 bg-amber-50 border border-amber-300 rounded flex items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center gap-2">
              <span class="font-bold text-amber-600 text-xs w-5">P${m.pos}</span>
              <img src="${sub.img}" class="w-8 h-10 object-cover rounded border border-amber-400">
              <div>
                <span class="font-bold text-amber-900 block leading-tight">${sub.name}</span>
                <span class="text-[10px] text-slate-400 line-through">休: ${m.name}</span>
              </div>
            </div>
            <span class="text-[10px] bg-amber-200 text-amber-800 font-bold px-1.5 py-0.5 rounded">アンダー</span>
          `;
        }
        lineupContainer.appendChild(div);
      });
    }
  </script>
</body>
</html>
