<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>劇場公演 データサイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { padding-bottom: 75px; } /* 下部ナビ用 */
    .avatar-img { object-fit: cover; width: 32px; height: 32px; border-radius: 9999px; flex-shrink: 0; }
    .avatar-img-lg { object-fit: cover; width: 48px; height: 48px; border-radius: 9999px; flex-shrink: 0; }
    .avatar-img-sm { object-fit: cover; width: 28px; height: 28px; border-radius: 9999px; flex-shrink: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-masks-theater"></i> 劇場公演 データサイト
      </h1>
      
      <!-- チーム選択 -->
      <select id="teamSelector" onchange="switchTeam(this.value)" class="bg-pink-700 text-white font-bold text-sm rounded-lg px-3 py-1.5 border border-pink-500 focus:outline-none w-full sm:w-auto cursor-pointer">
        <option value="A">チームA（ここからだ）</option>
        <option value="B">チームB（RESET）</option>
        <option value="C">チームC（M.T.に捧ぐ）</option>
        <option value="D">チームD（シアターの女神）</option>
        <option value="E">チームE（制服の芽）</option>
        <option value="F">チームF（ここにだって天使はいる）</option>
        <option value="G">チームG（目撃者）</option>
      </select>
    </div>

    <!-- 検索バー ＆ サジェスト -->
    <div class="max-w-4xl mx-auto mt-3 relative">
      <div class="relative">
        <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="メンバー名 / チーム名 / 演目名で検索..." 
               class="w-full pl-9 pr-4 py-2 bg-white text-slate-800 text-sm rounded-lg shadow-inner focus:outline-none focus:ring-2 focus:ring-pink-300">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>
      <div id="searchSuggest" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-xl z-50 max-h-60 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto p-4">

    <!-- Tab 1: カレンダー -->
    <section id="tab-calendar" class="tab-content">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200 mb-4">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
          <h2 class="text-base font-bold text-slate-700 flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-pink-500"></i> 劇場スケジュール（<span id="currentMonthLabel">2026年10月</span>）
          </h2>
          <!-- JSONファイル手動読み込みボタン -->
          <label class="cursor-pointer bg-pink-50 text-pink-600 hover:bg-pink-100 px-2.5 py-1 rounded border border-pink-200 text-xs font-semibold flex items-center gap-1 transition">
            <i class="fa-solid fa-file-import"></i> 月別JSON読込
            <input type="file" id="jsonFileInput" accept=".json" onchange="loadJsonFile(event)" class="hidden">
          </label>
        </div>

        <!-- フィルターボタン（劇場別 ＆ チーム別） -->
        <div class="flex flex-wrap gap-1.5 mb-4">
          <button onclick="filterSchedule('ALL', this)" class="filter-btn active bg-slate-800 text-white text-xs font-semibold px-3 py-1 rounded-full">全スケジュール</button>
          <button onclick="filterSchedule('AKB48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">AKB48劇場</button>
          <button onclick="filterSchedule('SKE48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">SKE48劇場</button>
          <button onclick="filterSchedule('NMB48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NMB48劇場</button>
          <button onclick="filterSchedule('HKT48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">HKT48劇場</button>
          <button onclick="filterSchedule('NGT48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">NGT48劇場</button>
          <button onclick="filterSchedule('STU48', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">STU48劇場</button>
          <button onclick="filterSchedule('TeamA', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームA</button>
          <button onclick="filterSchedule('TeamB', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームB</button>
          <button onclick="filterSchedule('TeamC', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームC</button>
          <button onclick="filterSchedule('TeamD', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームD</button>
          <button onclick="filterSchedule('TeamE', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームE</button>
          <button onclick="filterSchedule('TeamF', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームF</button>
          <button onclick="filterSchedule('TeamG', this)" class="filter-btn bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">チームG</button>
        </div>
        <div id="calendarList" class="space-y-3"></div>
      </div>
    </section>

    <!-- Tab 2: ポジション ＆ ユニット一覧 -->
    <section id="tab-positions" class="tab-content hidden space-y-4">
      
      <!-- ① ポジション一覧 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <div>
            <h2 id="posTeamTitle" class="text-lg font-bold text-slate-800">チームA</h2>
            <p id="posStageTitle" class="text-xs text-pink-600 font-semibold">演目：「ここからだ」公演</p>
          </div>
          <span id="fixedCountBadge" class="bg-pink-100 text-pink-700 text-xs font-bold px-2.5 py-1 rounded-full">固定 16名</span>
        </div>

        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">ポジション一覧（16枠 / 固定メンバー ＆ アンダー）</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 text-slate-600">
                <th class="p-2 w-16 text-center">Pos</th>
                <th class="p-2" colspan="2">固定メンバー</th>
                <th class="p-2" colspan="2">アンダー</th>
              </tr>
            </thead>
            <tbody id="positionTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- ② 日別ユニット一覧 -->
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1 flex items-center gap-1.5">
          <i class="fa-solid fa-music text-pink-500"></i> 日別ユニットポジション一覧
        </h3>
        <p class="text-xs text-slate-400 mb-3">公演日付ごとのユニット出演記録</p>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse border border-slate-200 whitespace-nowrap">
            <thead id="unitTableHead" class="bg-slate-50 text-slate-700 border-b border-slate-200"></thead>
            <tbody id="unitTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- Tab 3: 出演・休演予想 -->
    <section id="tab-predict" class="tab-content hidden">
      <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-1">
          <h2 class="text-base font-bold text-slate-800">出演・休演予想シミュレーター</h2>
          <span id="memberCountBadge" class="text-xs bg-slate-100 text-slate-600 font-bold px-2 py-0.5 rounded-full">全38名</span>
        </div>
        <p class="text-xs text-slate-500 mb-4">メンバーアイコンをタップして【休演】を選択すると、設定されたポジション連鎖（アンダーリスト）に従って自動補填されます。</p>

        <!-- チーム全員一覧 -->
        <div class="mb-6">
          <h3 class="text-xs font-bold text-slate-600 mb-2 border-b pb-1 flex justify-between items-center">
            <span>チーム全員一覧（タップで休演切替）</span>
            <button onclick="resetAbsence()" class="text-xs text-pink-600 hover:underline font-normal">休演リセット</button>
          </h3>
          <div id="memberGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5"></div>
        </div>

        <!-- 予想スターティングラインナップ -->
        <div>
          <h3 class="text-xs font-bold text-pink-600 mb-2 border-b pb-1 flex justify-between items-center">
            <span>予想スターティング16名</span>
            <span id="subCountText" class="text-xs text-slate-500 font-normal">アンダー補填: 0名</span>
          </h3>
          <div id="predictedLineup" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50">
    <div class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('calendar')" id="nav-calendar" class="nav-btn active flex-1 py-2.5 text-center text-xs font-semibold text-pink-600">
        <i class="fa-regular fa-calendar-days text-base block mb-0.5"></i>
        カレンダー
      </button>
      <button onclick="switchTab('positions')" id="nav-positions" class="nav-btn flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-pink-500">
        <i class="fa-solid fa-users-rectangle text-base block mb-0.5"></i>
        ポジション
      </button>
      <button onclick="switchTab('predict')" id="nav-predict" class="nav-btn flex-1 py-2.5 text-center text-xs font-semibold text-slate-400 hover:text-pink-500">
        <i class="fa-solid fa-wand-magic-sparkles text-base block mb-0.5"></i>
        予想
      </button>
    </div>
  </nav>

    // --- JSONデータ読み込み機能 ---
    async function loadScheduleJson(jsonPath) {
      try {
        const response = await fetch(jsonPath);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        processAndSetScheduleData(data);
      } catch (err) {
        console.warn("fetchによる自動読み込みスキップ (ファイル直開きの可能性があります):", err);
      }
    }

    function loadJsonFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          processAndSetScheduleData(data);
        } catch (err) {
          alert("JSONファイルの読み込みに失敗しました。構造を確認してください。");
        }
      };
      reader.readAsText(file);
    }

    function processAndSetScheduleData(data) {
      if (data.month) {
        const parts = data.month.split('-');
        if (parts.length === 2) {
          document.getElementById('currentMonthLabel').innerText = `${parts[0]}年${parseInt(parts[1])}月`;
        }
      }

      const events = data.events || (Array.isArray(data) ? data : []);

      SCHEDULE_DATA = events.map(item => {
        const positionChanges = item.positions || item.positionChanges || [];
        const teamKey = item.team;

        // JSONの positions (例: "岡腰星来 ← 新井梨杏 ← 宗雪里香") からアンダー連鎖(underChain)を自動登録
        if (teamKey && positionChanges.length > 0) {
          updateUnderChainsFromPositions(positionChanges, teamKey);
        }

        return {
          ...item,
          time: item.time || "18:30",
          theater: item.theater || (item.team === "A" ? "AKB48劇場" : "劇場"),
          stage: item.stage || (RAW_TEAMS_DATA[item.team] ? RAW_TEAMS_DATA[item.team].stage : ""),
          performersText: Array.isArray(item.members) ? item.members.join('・') : (item.performersText || ""),
          positionChanges: positionChanges
        };
      });

      renderCalendar();
      renderPositionsAndUnits();
      initPredictTab();
    }

    // positionsの矢印文字列からアンダー関係を抽出・登録するヘルパー
    function updateUnderChainsFromPositions(positions, teamKey) {
      const team = RAW_TEAMS_DATA[teamKey];
      if (!team) return;
      if (!team.underChain) team.underChain = {};

      positions.forEach(posStr => {
        if (typeof posStr !== 'string') return;

        // "←" または "<-" で分割して前後の関係を取得
        const members = posStr.split(/←|<-/).map(m => m.trim()).filter(Boolean);
        if (members.length < 2) return;

        for (let i = 0; i < members.length - 1; i++) {
          const target = members[i];      // 例: 岡腰星来 (または 新井梨杏)
          const under = members[i + 1];   // 例: 新井梨杏 (または 宗雪里香)

          if (!team.underChain[target]) {
            team.underChain[target] = [];
          }
          // まだアンダーリストに登録されていなければ追加
          if (!team.underChain[target].includes(under)) {
            team.underChain[target].push(under);
          }
        }
      });
    }

    // 検索機能
    function onSearchInput(val) {
      const suggestBox = document.getElementById('searchSuggest');
      if (!val.trim()) {
        suggestBox.classList.add('hidden');
        return;
      }
      const query = val.toLowerCase();
      let matches = [];

      Object.keys(RAW_TEAMS_DATA).forEach(key => {
        const t = RAW_TEAMS_DATA[key];
        if (t.name.toLowerCase().includes(query) || t.stage.toLowerCase().includes(query)) {
          matches.push({ type: 'team', label: `${t.name} (演目: ${t.stage})`, key: key });
        }
        t.allMembers.forEach(name => {
          if (name.toLowerCase().includes(query)) {
            const fixedIdx = t.fixed.indexOf(name);
            const roleStr = (fixedIdx >= 0 && fixedIdx < 16) ? `${fixedIdx + 1}番手` : 'アンダー';
            matches.push({ type: 'member', label: `${name} (${t.name} ${roleStr})`, key: key });
          }
        });
      });

      if (matches.length === 0) {
        suggestBox.classList.add('hidden');
        return;
      }

      suggestBox.innerHTML = matches.slice(0, 8).map(m => `
        <div onclick="selectSuggest('${m.key}')" class="p-2.5 hover:bg-pink-50 cursor-pointer flex justify-between items-center">
          <span class="font-medium text-slate-800">${m.label}</span>
          <span class="text-xs text-pink-600 font-bold">${m.type === 'team' ? 'チーム' : 'メンバー'}</span>
        </div>
      `).join('');
      suggestBox.classList.remove('hidden');
    }

    // 過去のスケジュールデータから特定の固定メンバーに対する直近の出演者を検索するヘルパー
    function getLastPerformerForPosition(teamKey, fixedName) {
      if (!SCHEDULE_DATA || SCHEDULE_DATA.length === 0) return null;
      for (let i = SCHEDULE_DATA.length - 1; i >= 0; i--) {
        const item = SCHEDULE_DATA[i];
        if (item.team === teamKey && item.positionChanges) {
          for (let posStr of item.positionChanges) {
            const members = posStr.split(/←|<-/).map(m => m.trim());
            if (members[0] === fixedName && members.length > 1) {
              return members[1]; // 直近でスライド出演した第1候補
            }
          }
        }
      }
      return null;
    }

    // スライド予想理由の自動生成ロジック
    function generatePredictionReason(teamKey, fixedName, assignedMember, candidateList, usedMembers) {
      if (assignedMember === fixedName) {
        return "固定メンバー（本出演）";
      }

      const lastPerformer = getLastPerformerForPosition(teamKey, fixedName);
      
      // 自分より優先順位が高かったもののスキップされた（休演または他ポ使用）メンバーを収集
      let skipped = [];
      for (let c of candidateList) {
        if (c === assignedMember) break;
        if (absentMembersMap[c]) {
          skipped.push(`${c}(休演)`);
        } else if (usedMembers.has(c)) {
          skipped.push(`${c}(他ポジション出演中)`);
        }
      }

      const skippedText = skipped.length > 0 ? ` [${skipped.join('・')}が不参加のため]` : "";

      if (lastPerformer && lastPerformer !== assignedMember) {
        return `前回の公演は ${lastPerformer} が出演したため${skippedText}、今回は ${assignedMember} と予想。`;
      } else if (lastPerformer && lastPerformer === assignedMember) {
        return `前回公演の実績（${lastPerformer}出演）に基づき${skippedText}、引き続き ${assignedMember} と予想。`;
      } else {
        return `${fixedName} の休演に伴い${skippedText}、優先順位に従い ${assignedMember} と予想。`;
      }
    }

    // 優先チェーンロジックに基づいたスターティング16名算出
    function renderPredictedLineup() {
      const team = RAW_TEAMS_DATA[currentTeamKey];
      const lineupContainer = document.getElementById('predictedLineup');
      lineupContainer.innerHTML = '';

      const usedMembers = new Set();
      const lineup = [];

      for (let pos = 1; pos <= 16; pos++) {
        const fixedName = team.fixed[pos - 1];
        
        let candidateList = [];
        if (fixedName) candidateList.push(fixedName);
        
        if (team.underChain && team.underChain[fixedName]) {
          candidateList.push(...team.underChain[fixedName]);
        }

        team.allMembers.forEach(m => {
          if (!candidateList.includes(m)) candidateList.push(m);
        });

        let assignedMember = null;
        for (let candidate of candidateList) {
          if (!absentMembersMap[candidate] && !usedMembers.has(candidate)) {
            assignedMember = candidate;
            break;
          }
        }

        if (assignedMember) {
          const isUnder = (assignedMember !== fixedName);
          
          // 既に登録済みのスライド・アンダーであるか判定 (underChain または過去の実績に存在)
          const lastPerformer = getLastPerformerForPosition(currentTeamKey, fixedName);
          const isRegisteredSlide = isUnder && (
            (team.underChain && team.underChain[fixedName] && team.underChain[fixedName].includes(assignedMember)) ||
            (lastPerformer === assignedMember)
          );

          // 予想理由を生成
          const reasonText = generatePredictionReason(currentTeamKey, fixedName, assignedMember, candidateList, usedMembers);

          usedMembers.add(assignedMember);

          lineup.push({
            pos: pos,
            name: assignedMember,
            fixedName: fixedName,
            isUnder: isUnder,
            isRegistered: isRegisteredSlide,
            reason: reasonText
          });
        } else {
          lineup.push({
            pos: pos,
            name: "未定",
            fixedName: fixedName,
            isUnder: true,
            isRegistered: false,
            reason: "候補メンバー不足"
          });
        }
      }

      let subCount = 0;

      lineup.forEach((item, index) => {
        const div = document.createElement('div');
        let posLabel = `P${item.pos}`;
        if (currentTeamKey === 'A' && team.predictPosNames && team.predictPosNames[index]) {
          posLabel = `${index + 1}<br><span class="text-[10px] font-normal">${team.predictPosNames[index]}</span>`;
        }

        if (!item.isUnder) {
          div.className = "p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex flex-col justify-between gap-1.5";
          div.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="font-bold text-slate-500 text-xs w-8 text-center leading-tight">${posLabel}</span>
                <img src="${getAvatar(item.name, 'E91E63')}" class="avatar-img-sm">
                <span class="font-bold text-slate-800 text-xs">${item.name}</span>
              </div>
              <span class="text-[10px] bg-slate-200 text-slate-600 font-semibold px-2 py-0.5 rounded-full">${item.pos}番手</span>
            </div>
          `;
        } else {
          subCount++;
          div.className = "p-2.5 bg-amber-50 border border-amber-200 rounded-lg flex flex-col gap-2";
          div.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="font-bold text-amber-700 text-xs w-8 text-center leading-tight">${posLabel}</span>
                <img src="${getAvatar(item.name, '9C27B0')}" class="avatar-img-sm border border-amber-300">
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="font-bold text-amber-900 text-xs block leading-tight">${item.name}</span>
                    ${item.isRegistered ? '<span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.2 rounded border border-emerald-300 flex items-center gap-0.5">︎︎︎︎☑︎ 出演あり</span>' : ''}
                  </div>
                  <span class="text-[10px] text-slate-400 ${item.fixedName ? 'line-through' : ''}">${item.fixedName ? '本: ' + item.fixedName : '固定なし'}</span>
                </div>
              </div>
              <span class="text-[10px] bg-amber-200 text-amber-800 font-bold px-2 py-0.5 rounded-full shrink-0">アンダー/スライド</span>
            </div>
            
            <!-- 予想理由表記欄 -->
            <div class="text-[11px] text-amber-900 bg-amber-100/70 p-1.5 rounded border border-amber-200/60 leading-relaxed">
              <span class="font-bold text-amber-800"><i class="fa-regular fa-comment-dots"></i> 予想理由:</span> ${item.reason}
            </div>
          `;
        }
        lineupContainer.appendChild(div);
      });

      document.getElementById('subCountText').innerText = `アンダー補填: ${subCount}名`;
    }
  </script>
</body>
</html>
